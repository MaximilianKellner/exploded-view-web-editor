<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playground | Explo.js Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./demo-page.css">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">

    <script type="module" src="./main.js"></script>
</head>
<body>
    <main class="demo-page">

        <section class="hero">
            <img class="hero-image" src="/demo-page-assets/hero.png" alt="">
            <div class="hero-content">
                <h1>Poly Performance</h1>
                <p class="h2">Max Kellner - 2025</p>
            </div>
        </section>

        <h2>6 detailgetreue Autos</h2>

        <div id="explo-viewer" style="width: 50vw; height: 50vh;"></div>
        <div id="explo-viewer-2" style="width: 50vw; height: 50vh;"></div>
        
        <button id="playBothBtn" type="button">Play/Pause</button>
        <input id="progressSlider" type="range" min="0" max="100" value="0">
        <button id="resetBtn" type="button">Reset</button>
        
        <h2>4 einzigartige Karten</h2>
            <img class="karten-img" src="/demo-page-assets/karten.png" alt="">
        <h2>Fotoalbum</h2>

            <img src="/demo-page-assets/fotoalbum.png" alt="">

    </main>
</body>
</html>
