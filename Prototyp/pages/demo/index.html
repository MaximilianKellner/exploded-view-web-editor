<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playground | Explo.js Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./demo-page.css">
    <link rel="icon" type="image/x-icon" href="../../favicon.ico">

    <script type="module" src="./main.js"></script>
</head>
<body>
    <main class="demo-page">

        <section class="hero">
            <img class="hero-image" src="../../demo-page-assets/hero.png" alt="">
            <div class="hero-content">
                <h1>Poly Performance</h1>
                <p class="h2">Max Kellner - 2025</p>
            </div>
        </section>

        <section class="viewer-section">
            <h2>6 detailgetreue Autos</h2>

            <div class="viewer-carousel">
                <button id="scenePrevBtn" class="scene-nav-btn" type="button" aria-label="Vorherige Szene">&lt;</button>

                <div class="viewer-stage">
                    <div id="explo-viewer" class="explo-viewer"></div>

                    <div class="viewer-controls">
                        <button id="playBothBtn" type="button">Play/Pause</button>
                        <input id="progressSlider" type="range" min="0" max="100" value="0">
                        <button id="resetBtn" type="button">
                            <img src="../../demo-page-assets/respawn.png" alt="Reset">
                        </button>
                    </div>
                </div>

                <button id="sceneNextBtn" class="scene-nav-btn" type="button" aria-label="Nächste Szene">&gt;</button>
            </div>

            <div id="scenePreviewBar" class="scene-preview-bar" aria-label="Szenenauswahl">
                <button class="scene-preview" type="button" data-scene-index="0" aria-label="Szene 1 auswählen">
                    <img src="../../demo-page-assets/car-thumbnails/f40.png" alt="Vorschau Szene 1">
                </button>
                <button class="scene-preview" type="button" data-scene-index="1" aria-label="Szene 2 auswählen">
                    <img src="../../demo-page-assets/car-thumbnails/supra.png" alt="Vorschau Szene 2">
                </button>
                <button class="scene-preview" type="button" data-scene-index="2" aria-label="Szene 3 auswählen">
                    <img src="../../demo-page-assets/car-thumbnails/r8.png" alt="Vorschau Szene 3">
                </button>
                <button class="scene-preview" type="button" data-scene-index="3" aria-label="Szene 4 auswählen">
                    <img src="../../demo-page-assets/car-thumbnails/gt3-touring.png" alt="Vorschau Szene 4">
                </button>
                <button class="scene-preview" type="button" data-scene-index="4" aria-label="Szene 5 auswählen">
                    <img src="../../demo-page-assets/car-thumbnails/gallardo.png" alt="Vorschau Szene 5">
                </button>
                <button class="scene-preview" type="button" data-scene-index="5" aria-label="Szene 6 auswählen">
                    <img src="../../demo-page-assets/car-thumbnails/911-old.png" alt="Vorschau Szene 6">
                </button>
            </div>
        </section>
        
        <h2>4 einzigartige Karten</h2>
            <img class="karten-img" src="../../demo-page-assets/karten.png" alt="">
        <h2>Fotoalbum</h2>

            <img src="../../demo-page-assets/fotoalbum.png" alt="">

    </main>
</body>
</html>
